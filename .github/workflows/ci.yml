name: CI

# Offline selftests of the click's Python/QML and of the release tooling on
# both platforms the maintainers use. Nothing here touches a device, a
# network channel or a signing key: every suite runs against in-process
# fakes and throwaway keys.
on:
  push:
    branches: [main, "rename-*", "wip/subscription-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Toolchain versions
        run: |
          python3 --version
          node --version
          openssl version || true
          # Ed25519 signing needs OpenSSL ≥ 1.1.1 (macOS /usr/bin ships LibreSSL);
          # scripts/release/openssl-resolve.sh picks Homebrew's when present.
          command -v brew >/dev/null && brew --prefix openssl@3 || true
      - name: Identity invariants
        run: python3 scripts/identity_selftest.py
      - name: Subscription UI handlers
        run: python3 scripts/subscription_selftest.py
      - name: Bridge (install pipeline, migrate verb, keep-awake swap)
        run: python3 scripts/bridge_selftest.py
      - name: Release verifier
        run: python3 scripts/release_selftest.py
      - name: Publisher (fake GitHub API, legacy transition)
        run: python3 scripts/publish_selftest.py
      - name: Signed-release CI pieces (candidate verifier, staging gate, workflow static checks, break-glass quiesce)
        run: python3 scripts/ci_release_selftest.py
      - name: Click packaging
        run: python3 scripts/click_selftest.py
      - name: Chat client + QML sweep
        run: python3 scripts/chat_selftest.py
      - name: Release watcher + heartbeat (+ launchd installer on macOS)
        run: python3 scripts/watch_selftest.py
      - name: Release watcher — signed-run corroboration + approval evidence (both channels)
        run: python3 scripts/watch_approval_selftest.py
      - name: Release-key directory rename (Stage 8 helper)
        run: python3 scripts/keys_rename_selftest.py
      - name: QR decoder + generator cross-check (vendored scripts/fixtures/qrlib.mjs)
        run: python3 scripts/qr_selftest.py

  # Deliberate breaks of the release tooling (Codex 2026-10-05 answer 4):
  # every break must turn its suite red. Once, on Linux — the ordinary
  # selftests above already run on both OSes.
  release-breaks:
    runs-on: ubuntu-24.04
    # Each watcher break re-runs the full watch selftest (~5 min); with the
    # five coverage breaks the job takes ~30 min, so allow 60.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Release-tooling deliberate breaks (each must turn its suite red)
        run: python3 scripts/ci_release_breaks.py
